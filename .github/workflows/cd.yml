name: cd

# Continuous delivery: runs only after `ci` passes on main (or by hand). Builds the two images
# in Dockerfile, publishes them to GitHub Container Registry, then starts the published images
# with docker-compose.yml and checks that the site and the party server answer.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  # The commit CI tested (workflow_run), or the one picked by hand.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: build and publish (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: [web, realtime]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: latest, and the commit SHA so every deploy can be traced and rolled back.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/try-one-more-${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.SHA }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  smoke:
    name: run the published images
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --wait blocks until both containers pass their HEALTHCHECK.
      - name: Start the stack from the registry
        run: |
          docker compose pull
          docker compose up -d --no-build --wait

      - name: Check the site and the party server
        run: |
          curl -fsS http://localhost:3000/ | grep -q 'Just One More'
          curl -fsS -o /dev/null http://localhost:3000/play/rage/levels
          curl -fsS -o /dev/null http://localhost:3000/c/rage-4-17/opengraph-image
          curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:2567/

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
