packages:
  - apps/*
  - packages/*

overrides:
  sharp: 0.35.5
  source-map-js: 1.2.2

allowBuilds:
  msgpackr-extract: false
  unrs-resolver: false

# Dependency install scripts are blocked by default (supply-chain hygiene, SECURITY.md §7).
# unrs-resolver (via eslint-config-next) ships its native binary as an optional dependency;
# its postinstall is only a fallback downloader, so it stays disabled. Lint verified without it.
# msgpackr-extract (via @colyseus/core) is an optional native speed-up; msgpackr falls back to
# pure JS without it. Realtime tests verified without it.
ignoredBuiltDependencies:
  - msgpackr-extract
  - unrs-resolver
