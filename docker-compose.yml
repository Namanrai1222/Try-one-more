# Runs the whole stack from the two images in Dockerfile.
#   docker compose up --build -d     build locally and start
#   docker compose pull && docker compose up -d --no-build   run the images CD published
# Open http://localhost:3000 (or WEB_PORT). Party rooms connect to ws://localhost:2567.
services:
  web:
    build:
      context: .
      target: web
    image: ghcr.io/namanrai1222/try-one-more-web:latest
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - realtime
    restart: unless-stopped

  realtime:
    build:
      context: .
      target: realtime
    image: ghcr.io/namanrai1222/try-one-more-realtime:latest
    ports:
      - '2567:2567'
    restart: unless-stopped
